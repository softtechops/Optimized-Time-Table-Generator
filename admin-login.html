<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - BIT Timetable</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <a href="login.html" class="back-link">
            <span>←</span> Back to Role Selection
        </a>

        <div class="logo">
            <div class="logo-badge">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <h2>ADMIN LOGIN</h2>
            <span class="app-subtitle">Secure Administration Portal</span>
        </div>

        <form onsubmit="return handleAdminLogin(event)">
            <div class="form-group">
                <label for="admin-id">Admin ID</label>
                <input type="text" id="admin-id" name="admin-id" placeholder="Enter admin username" value="admin" required>
            </div>

            <div class="form-group">
                <label for="admin-pass">Password</label>
                <input type="password" id="admin-pass" name="admin-pass" placeholder="••••••••" value="password" required>
            </div>

            <button type="submit" style="margin-top: 10px;">Sign In to Dashboard</button>
        </form>

        <div class="demo-box" style="margin-top: 24px;">
            <div><strong>Default Admin Credentials:</strong></div>
            <div>Admin ID: <code>admin</code></div>
            <div>Password: <code>password</code></div>
        </div>
    </div>

    <script>
        function handleAdminLogin(event) {
            event.preventDefault();
            const adminId = document.getElementById('admin-id').value.trim();
            const adminPass = document.getElementById('admin-pass').value.trim();

            if (adminId === "admin" && adminPass === "password") {
                window.location.href = 'admin-dashboard.html';
            } else {
                alert('Invalid Admin ID or Password. (Hint: use admin / password)');
            }
        }
    </script>
</body>
</html>
