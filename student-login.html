<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - BIT Timetable</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <a href="login.html" class="back-link">
            <span>←</span> Back to Role Selection
        </a>

        <div class="logo">
            <div class="logo-badge" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%);">
                <svg viewBox="0 0 24 24">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
            </div>
            <h2>STUDENT LOGIN</h2>
            <span class="app-subtitle">Student Timetable Portal</span>
        </div>

        <form onsubmit="return handleStudentLogin(event)">
            <div class="form-group">
                <label for="student-id">Student Roll Number / ID</label>
                <input type="text" id="student-id" name="student-id" placeholder="e.g. 7376221EC241" value="7376221EC241" required>
            </div>

            <div class="form-group">
                <label for="student-pass">Password</label>
                <input type="password" id="student-pass" name="student-pass" placeholder="••••••••" value="student123" required>
            </div>

            <button type="submit" style="margin-top: 10px; background: linear-gradient(135deg, #10b981 0%, #059669 100%);">View My Schedule</button>
        </form>

        <div class="demo-box" style="margin-top: 24px;">
            <div><strong>Student Demo Credentials:</strong></div>
            <div>Student ID: <code>7376221EC241</code> (or any ID)</div>
            <div>Password: <code>student123</code></div>
        </div>
    </div>

    <script>
        function handleStudentLogin(event) {
            event.preventDefault();
            const studentId = document.getElementById('student-id').value.trim();
            const studentPass = document.getElementById('student-pass').value.trim();

            if (studentId && studentPass === "student123") {
                localStorage.setItem('loggedInStudent', studentId);
                window.location.href = 'student-dashboard.html';
            } else {
                alert('Invalid Student ID or Password. (Hint: password is student123)');
            }
        }
    </script>
</body>
</html>
